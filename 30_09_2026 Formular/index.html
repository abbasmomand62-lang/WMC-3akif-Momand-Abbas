<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Anmeldeformular</title>
</head>

<body>

<h1>Anmeldeformular</h1>

<form action="mailto:lorenzd@spengergasse.at?subject=Anmeldung"
      method="post" enctype="text/plain">

    Vorname:
    <input type="text" name="Vorname" required>
    <br><br>

    Nachname:
    <input type="text" name="Nachname" required>
    <br><br>

    E-Mail:
    <input type="email" name="Email" required>
    <br><br>

    Telefonnummer:
    <input type="tel" name="Telefon"
           pattern="[0-9]{10,13}" required>
    <br><br>

    Geschlecht:
    <input type="radio" name="Geschlecht" value="Männlich"> Männlich
    <input type="radio" name="Geschlecht" value="Weiblich"> Weiblich
    <input type="radio" name="Geschlecht" value="Divers"> Divers

    <br><br>

    Klasse:
    <select name="Klasse">
        <option>1A</option>
        <option>1B</option>
        <option>2A</option>
        <option>2B</option>
    </select>

    <br><br>

    Interessen:
    <input type="checkbox" name="HTML"> HTML
    <input type="checkbox" name="CSS"> CSS
    <input type="checkbox" name="Java"> Java
    <input type="checkbox" name="SQL"> SQL

    <br><br>

    Mehrfachauswahl:
    <select name="Bereiche" multiple>
        <option>Programmierung</option>
        <option>Webentwicklung</option>
        <option>Datenbanken</option>
        <option>Netzwerke</option>
    </select>

    <br><br>

    Alter:
    <input type="number" name="Alter">

    <br><br>

    Geburtsdatum:
    <input type="date" name="Geburtsdatum">

    <br><br>

    Nachricht:<br>
    <textarea name="Nachricht" rows="5" cols="40"></textarea>

    <br><br>

    <input type="checkbox" required>
    Ich bestätige meine Angaben.

    <br><br>

    <input type="submit" value="Absenden">
    <input type="reset" value="Löschen">

</form>

</body>
</html>
